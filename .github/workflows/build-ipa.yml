
name: Build GestaltX IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -list -project GestaltX.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          xcodebuild \
            -project GestaltX.xcodeproj \
            -scheme GestaltX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GestaltX.app"

          test -d "$APP"
          test -d "$APP/PlugIns/GestaltXShare.appex"

          mkdir -p package/Payload
          cp -R "$APP" package/Payload/

          cd package
          zip -qry ../GestaltX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX-unsigned-IPA
          path: GestaltX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
